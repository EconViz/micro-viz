[project]
name = "micro-viz"
version = "0.2.0.dev0"
description = "Renderer-neutral diagrams and analysis for producer theory and market structure."
readme = "README.md"
authors = [{ name = "Anthony Sung", email = "sungpinyue@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
keywords = ["economics", "microeconomics", "visualization", "education"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "mosaickit>=1.0.0rc9,<2.0.0",
]

[project.entry-points."econviz.config"]
micro = "micro_viz.config:Config"

[project.urls]
Homepage = "https://econ-viz.org"
Repository = "https://github.com/EconViz/micro-viz"
Issues = "https://github.com/EconViz/micro-viz/issues"
Changelog = "https://github.com/EconViz/micro-viz/blob/main/CHANGELOG.md"

[project.optional-dependencies]
animation = [
    "kinetickit[raster]>=1.0.0b2,<2.0.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "micro_viz"
module-root = "src"

[dependency-groups]
dev = [
    "build>=1.2.0,<2.0.0",
    "mypy>=1.13.0,<2.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--maxfail=1 --disable-warnings -q"

[tool.coverage.run]
source = ["micro_viz"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"examples/scripts/*/*.py" = ["E402"]

[tool.mypy]
files = ["src/micro_viz", "tests", "examples/scripts"]
mypy_path = "examples/scripts"
python_version = "3.10"
strict = true
follow_imports = "skip"
